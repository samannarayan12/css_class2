<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.product-card {
			width: 45%;
			height: 450px;
			margin: 20px auto;
			padding: 15px;
			border: 2px solid black;
			border-radius: 10px;
		}

		.product-card img {
			width: 100%;
			max-width: 100%;
			min-width: 200px;
			height: 350px;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<div class="product-card">
		<img src="https://m.media-amazon.com/images/I/61ZS1SwxecL._AC_UF1000,1000_QL80_.jpg">
		<h2>Red Running Shoe</h2>
		<p>Lightweight Running Shoe</p>
	</div>
</body>
</html>
