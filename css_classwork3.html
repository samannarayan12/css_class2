<!DOCTYPE html>
<html>
<head>
	<title>Document</title>
	<style>
		h3 {
			text-align: right;
			color: darkgreen;
			font-family: Georgia, serif;
		}

		.tagline {
			text-align: center;
			text-transform: uppercase;
			letter-spacing: 2px;
		}

		table {
			width: 50%;
			margin: 0 auto;
			border-collapse: collapse;
		}

		th, td {
			border: 1px solid black;
			text-align: center;
			vertical-align: middle;
			padding: 8px;
		}
	</style>
</head>
<body>
	<h3>Brightline Solutions</h3>
	<p class="tagline">We're here to help</p>

	<table>
		<tr>
			<th>Department</th>
			<th>Phone Number</th>
		</tr>
		<tr>
			<td>Sales</td>
			<td>(555) 010-1234</td>
		</tr>
		<tr>
			<td>Support</td>
			<td>(555) 010-5678</td>
		</tr>
	</table>
</body>
</html>
