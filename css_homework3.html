<!DOCTYPE html>
<html>
<head>
	<title>Document</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<style>
		h3 {
			text-align: right;
			font: 28px Georgia, serif;
			color: darkred;
		}

		.welcome {
			text-align: center;
			text-transform: uppercase;
			letter-spacing: 2px;
			word-spacing: 5px;
		}

		a {
			color: darkgreen;
			text-decoration: none;
		}

		a:hover {
			color: darkred;
		}

		table {
			width: 60%;
			margin: 20px auto;
			border-collapse: collapse;
		}

		th, td {
			border: 1px solid black;
			text-align: center;
			vertical-align: middle;
			padding: 10px;
		}
	</style>
</head>
<body>
	<h3><i class="fa-solid fa-utensils" aria-hidden="true"></i> Bella's Kitchen</h3>
	<p class="welcome">Welcome, we're glad you're here!</p>
	<p style="text-align: center;"><a href="#menu">See today's menu</a></p>

	<table id="menu">
		<tr>
			<th>Menu Item</th>
			<th>Price</th>
		</tr>
		<tr>
			<td><i class="fa-solid fa-pizza-slice" aria-hidden="true"></i> Margherita Pizza</td>
			<td>$12</td>
		</tr>
		<tr>
			<td>Garden Pasta</td>
			<td>$14</td>
		</tr>
		<tr>
			<td>Tomato Soup</td>
			<td>$8</td>
		</tr>
	</table>
</body>
</html>
